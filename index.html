<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fast, keyboard-friendly calculator with scientific mode, history and themes." />
    <meta name="color-scheme" content="light dark" />
    <title>Calc / Quick maths</title>

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/calculator.css" />

    <!-- Apply the saved theme before first paint to avoid a flash of the wrong palette. -->
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('my-calculator:theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        /* storage unavailable: fall back to the system theme */
      }
    </script>
  </head>
  <body>
    <div class="app">
      <main class="calculator" data-mode="basic" aria-label="Calculator">
        <header class="calculator__header">
          <div>
            <p class="eyebrow">My calculator</p>
            <h1>Quick maths.</h1>
          </div>
          <div class="toolbar">
            <label class="visually-hidden" for="theme">Theme</label>
            <select id="theme" class="chip">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
            <button id="mode-toggle" type="button" class="chip" aria-pressed="false">Scientific</button>
          </div>
        </header>

        <section class="display" aria-label="Display">
          <output id="expression" class="display__expression" aria-label="Expression"></output>
          <output id="result" class="display__result" aria-live="polite" data-mode="idle">0</output>
          <div class="display__meta">
            <span id="status" class="display__status" role="status" aria-live="polite"></span>
            <fieldset id="angle-mode" class="segmented" hidden>
              <legend class="visually-hidden">Angle unit</legend>
              <input type="radio" id="angle-deg" name="angle" value="deg" checked />
              <label for="angle-deg">DEG</label>
              <input type="radio" id="angle-rad" name="angle" value="rad" />
              <label for="angle-rad">RAD</label>
            </fieldset>
            <button id="copy" type="button" class="ghost">Copy</button>
          </div>
        </section>

        <section id="scientific-keys" class="keypad keypad--scientific" aria-label="Scientific keys" hidden></section>
        <section id="basic-keys" class="keypad" aria-label="Keypad"></section>
      </main>

      <aside class="history" aria-labelledby="history-title">
        <header class="history__header">
          <h2 id="history-title">History</h2>
          <button id="clear-history" type="button" class="ghost" disabled>Clear</button>
        </header>
        <ul id="history-list" class="history__list"></ul>
        <p id="history-empty" class="history__empty">No calculations yet.</p>
      </aside>
    </div>

    <p class="hint">
      Keyboard: digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> <kbd>%</kbd>, <kbd>Enter</kbd> to evaluate,
      <kbd>Backspace</kbd>, <kbd>Esc</kbd> to clear. In scientific mode: <kbd>(</kbd> <kbd>)</kbd> <kbd>^</kbd>
      <kbd>r</kbd> root, <kbd>s</kbd> <kbd>c</kbd> <kbd>t</kbd> trig, <kbd>l</kbd> log, <kbd>n</kbd> ln, <kbd>p</kbd> π.
    </p>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
