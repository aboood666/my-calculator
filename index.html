<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple calculator website.">
  <title>Calc / Simple Calculator</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #6b6f76;
      --paper: #f4f1ea;
      --panel: #fffdf8;
      --key: #ebe6dc;
      --accent: #176b87;
      --accent-dark: #0f536a;
      --operator: #e7a83e;
      --line: rgba(32, 33, 36, 0.13);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: radial-gradient(circle at top left, #d9e6e1, transparent 42%), var(--paper);
      font-family: "Trebuchet MS", sans-serif;
    }

    .calculator {
      width: min(100%, 380px);
      padding: 22px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 12px 12px 0 rgba(32, 33, 36, 0.09);
    }

    header { margin-bottom: 20px; }
    .label {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font: 700 2rem Georgia, "Times New Roman", serif; }

    .display {
      min-height: 104px;
      display: flex;
      align-items: end;
      justify-content: end;
      overflow: hidden;
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      background: #f8f6f0;
      text-align: right;
      font: 700 clamp(2rem, 9vw, 3rem) Georgia, "Times New Roman", serif;
      overflow-wrap: anywhere;
    }

    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button {
      min-height: 58px;
      border: 0;
      color: var(--ink);
      background: var(--key);
      font: 700 1.15rem "Trebuchet MS", sans-serif;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease;
    }
    button:hover { background: #ddd6c9; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .operator { color: #fff; background: var(--operator); }
    .operator:hover { background: #ca8e25; }
    .clear { color: #fff; background: var(--accent); }
    .clear:hover { background: var(--accent-dark); }
    .equals { color: #fff; background: var(--accent); }
    .equals:hover { background: var(--accent-dark); }
    .wide { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header>
      <p class="label">My calculator</p>
      <h1>Quick maths.</h1>
    </header>
    <output class="display" id="display" aria-live="polite">0</output>
    <section class="keys" aria-label="Calculator buttons">
      <button class="clear wide" data-action="clear">Clear</button>
      <button class="operator" data-action="operator" data-value="/" aria-label="Divide">÷</button>
      <button class="operator" data-action="operator" data-value="*" aria-label="Multiply">×</button>
      <button data-action="number" data-value="7">7</button>
      <button data-action="number" data-value="8">8</button>
      <button data-action="number" data-value="9">9</button>
      <button class="operator" data-action="operator" data-value="-" aria-label="Subtract">−</button>
      <button data-action="number" data-value="4">4</button>
      <button data-action="number" data-value="5">5</button>
      <button data-action="number" data-value="6">6</button>
      <button class="operator" data-action="operator" data-value="+" aria-label="Add">+</button>
      <button data-action="number" data-value="1">1</button>
      <button data-action="number" data-value="2">2</button>
      <button data-action="number" data-value="3">3</button>
      <button class="equals" data-action="equals">=</button>
      <button class="wide" data-action="number" data-value="0">0</button>
      <button data-action="decimal" data-value=".">.</button>
    </section>
  </main>

  <script>
    const display = document.querySelector("#display");
    let currentValue = "0";
    let storedValue = null;
    let operator = null;
    let waitingForValue = false;

    function updateDisplay() {
      display.textContent = currentValue;
    }

    function calculate(first, second, operation) {
      if (operation === "+") return first + second;
      if (operation === "-") return first - second;
      if (operation === "*") return first * second;
      if (operation === "/") return second === 0 ? null : first / second;
      return second;
    }

    function chooseOperator(nextOperator) {
      const value = Number(currentValue);
      if (operator && waitingForValue) {
        operator = nextOperator;
        return;
      }
      if (storedValue === null) {
        storedValue = value;
      } else if (operator) {
        const result = calculate(storedValue, value, operator);
        currentValue = result === null ? "Cannot divide by zero" : String(result);
        storedValue = result;
      }
      operator = nextOperator;
      waitingForValue = true;
      updateDisplay();
    }

    function pressEquals() {
      if (operator === null || storedValue === null) return;
      const result = calculate(storedValue, Number(currentValue), operator);
      currentValue = result === null ? "Cannot divide by zero" : String(result);
      storedValue = null;
      operator = null;
      waitingForValue = true;
      updateDisplay();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const { action, value } = button.dataset;

      if (action === "clear") {
        currentValue = "0";
        storedValue = null;
        operator = null;
        waitingForValue = false;
      } else if (action === "number") {
        if (currentValue === "Cannot divide by zero" || waitingForValue) currentValue = "0";
        currentValue = currentValue === "0" ? value : currentValue + value;
        waitingForValue = false;
      } else if (action === "decimal" && !currentValue.includes(".")) {
        currentValue += value;
      } else if (action === "operator") {
        chooseOperator(value);
      } else if (action === "equals") {
        pressEquals();
      }
      updateDisplay();
    });
  </script>
</body>
</html>
